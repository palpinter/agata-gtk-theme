# Agata Gruvbox Dark color scheme, generated by tools/gen-app-themes.py from extras/palette.json.
# Matches the Agata-Gruvbox-Dark GTK / GNOME Shell theme (https://github.com/palpinter/agata-gtk-theme).
# Needs a true-color terminal (COLORTERM=truecolor) and mc built with S-Lang; see extras/mc/README.md.

[skin]
    description = Agata Gruvbox Dark
    truecolors = true

[Lines]
    horiz = ─
    vert = │
    lefttop = ╭
    righttop = ╮
    leftbottom = ╰
    rightbottom = ╯
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ╭
    drighttop = ╮
    dleftbottom = ╰
    drightbottom = ╯
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[aliases]
    Background = #282828
    Surface = #3c3836
    Elevated = #504945
    Shade = #1e1e1e
    Selection = #504945
    Text = #ebdbb2
    TextBright = #fbf1c7
    TextDim = #a89984
    Faint = #928374
    Accent = #83a598
    Cursor = #83a598
    CursorText = #282828
    AnsiRed = #fb4934
    AnsiGreen = #b8bb26
    AnsiYellow = #fabd2f
    AnsiBlue = #83a598
    AnsiMagenta = #d3869b
    AnsiCyan = #8ec07c
    MarkedText = #282828
    Match = #8ec07c
    MatchText = #282828
    MatchFocused = #fabd2f
    Error = #cc241d
    ErrorText = #fbf1c7
    DiffAdded = #4c4d28
    DiffRemoved = #5d302b
    DiffChanged = #3f4744
    DiffChangedNew = #67552a

[core]
    _default_ = Text;Background
    selected = CursorText;Cursor
    marked = AnsiYellow;;bold
    markselect = MarkedText;AnsiYellow;bold
    gauge = CursorText;Cursor
    input = Text;Background
    inputunchanged = TextDim;Background
    inputmark = Text;Selection
    disabled = TextDim;Surface
    reverse = CursorText;Cursor
    commandlinemark = Text;Selection
    header = Accent;;bold
    inputhistory =
    commandhistory =
    shadow = Faint;Shade

[dialog]
    _default_ = Text;Surface
    dfocus = CursorText;Cursor
    dhotnormal = Accent;;underline
    dhotfocus = CursorText;Cursor;underline
    dtitle = Accent;;bold

[error]
    _default_ = ErrorText;Error
    errdfocus = Error;ErrorText
    errdhotnormal = ;;underline
    errdhotfocus = Error;ErrorText;underline
    errdtitle = ;;bold

[filehighlight]
    directory = AnsiBlue;;bold
    executable = AnsiGreen;;bold
    symlink = AnsiCyan;;bold
    hardlink =
    stalelink = AnsiRed;;bold+underline
    device = AnsiYellow;;bold
    special = AnsiYellow
    core = AnsiRed
    temp = TextDim
    archive = AnsiRed
    doc = AnsiYellow
    source = AnsiCyan
    media = AnsiMagenta
    graph = AnsiMagenta;;bold
    database = AnsiGreen

[menu]
    _default_ = Text;Surface
    menusel = CursorText;Cursor
    menuhot = Accent;;underline
    menuhotsel = CursorText;Cursor;underline
    menuinactive = Text;Surface

[popupmenu]
    _default_ = Text;Surface
    menusel = CursorText;Cursor
    menutitle = Accent;;bold

[buttonbar]
    hotkey = Accent;Background
    button = Text;Surface

[statusbar]
    _default_ = Text;Surface

[help]
    _default_ = Text;Surface
    helpitalic = AnsiGreen;;italic
    helpbold = TextBright;;bold
    helplink = Accent;;underline
    helpslink = CursorText;Cursor
    helptitle = Accent;;bold

[editor]
    _default_ = Text;Background
    editbold = AnsiYellow;;bold
    editmarked = Text;Selection
    editwhitespace = Faint;Background
    editnonprintable = ;Shade
    editlinestate = TextDim;Surface
    bookmark = Text;Elevated
    bookmarkfound = MatchText;Match
    editrightmargin = ;Surface
    editbg = ;Surface
    editframe = TextDim
    editframeactive = Accent
    editframedrag = MatchFocused

[viewer]
    _default_ = Text;Background
    viewbold = TextBright;;bold
    viewunderline = Accent;;underline
    viewselected = MatchText;Match

[diffviewer]
    added = Text;DiffAdded
    changedline = Text;DiffChanged
    changednew = Text;DiffChangedNew;bold
    changed = Text;DiffChanged
    removed = Text;DiffRemoved
    error = ErrorText;Error

[widget-panel]
    sort-up-char = ▴
    sort-down-char = ▾
    hiddenfiles-show-char = •
    hiddenfiles-hide-char = ○
    history-prev-item-char = ◂
    history-next-item-char = ▸
    history-show-list-char = ▾
    filename-scroll-left-char = ◂
    filename-scroll-right-char = ▸

[widget-scrollbar]
    first-vert-char = ▴
    last-vert-char = ▾
    first-horiz-char = ◂
    last-horiz-char = ▸
    current-char = ■
    background-char = ░

[widget-editor]
    window-state-char = ↕
    window-close-char = ✕
