# Agata Nord Dark color scheme, generated by tools/gen-app-themes.py from extras/palette.json.
# Matches the Agata-Nord-Dark GTK / GNOME Shell theme (https://github.com/palpinter/agata-gtk-theme).

[colors.primary]
background = "#303744"
foreground = "#d8dee9"
dim_foreground = "#a5abb6"
bright_foreground = "#eceff4"

[colors.cursor]
text = "#303744"
cursor = "#81a1c1"

[colors.vi_mode_cursor]
text = "#303744"
cursor = "#88c0d0"

[colors.selection]
text = "CellForeground"
background = "#4c566a"

[colors.search.matches]
foreground = "CellBackground"
background = "#88c0d0"

[colors.search.focused_match]
foreground = "CellBackground"
background = "#ebcb8b"

[colors.hints.start]
foreground = "#303744"
background = "#ebcb8b"

[colors.hints.end]
foreground = "#303744"
background = "#88c0d0"

[colors.footer_bar]
foreground = "#d8dee9"
background = "#394253"

