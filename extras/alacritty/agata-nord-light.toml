# Agata Nord Light color scheme, generated by tools/gen-app-themes.py from extras/palette.json.
# Matches the Agata-Nord-Light GTK / GNOME Shell theme (https://github.com/palpinter/agata-gtk-theme).

[colors.primary]
background = "#eceff4"
foreground = "#2e3440"
dim_foreground = "#4c566a"
bright_foreground = "#2e3440"

[colors.cursor]
text = "#eceff4"
cursor = "#5e81ac"

[colors.vi_mode_cursor]
text = "#eceff4"
cursor = "#357587"

[colors.selection]
text = "CellForeground"
background = "#c5ccd8"

[colors.search.matches]
foreground = "CellBackground"
background = "#357587"

[colors.search.focused_match]
foreground = "CellBackground"
background = "#8d6618"

[colors.hints.start]
foreground = "#eceff4"
background = "#8d6618"

[colors.hints.end]
foreground = "#eceff4"
background = "#357587"

[colors.footer_bar]
foreground = "#2e3440"
background = "#e5e9f0"

[colors.normal]
black = "#3b4252"
red = "#b54954"
green = "#597442"
yellow = "#8d6618"
blue = "#4d6e96"
magenta = "#8c5d83"
cyan = "#357587"
white = "#d8dee9"

[colors.bright]
black = "#616e88"
red = "#bf616a"
green = "#719353"
yellow = "#b2811f"
blue = "#5e81ac"
magenta = "#a87ca0"
cyan = "#4393aa"
white = "#e5e9f0"
