# Agata Gruvbox Light color scheme, generated by tools/gen-app-themes.py from extras/palette.json.
# Matches the Agata-Gruvbox-Light GTK / GNOME Shell theme (https://github.com/palpinter/agata-gtk-theme).

[colors.primary]
background = "#f9f5d7"
foreground = "#3c3836"
dim_foreground = "#7c6f64"
bright_foreground = "#282828"

[colors.cursor]
text = "#f9f5d7"
cursor = "#458588"

[colors.vi_mode_cursor]
text = "#f9f5d7"
cursor = "#427b58"

[colors.selection]
text = "CellForeground"
background = "#d5c4a1"

[colors.search.matches]
foreground = "CellBackground"
background = "#427b58"

[colors.search.focused_match]
foreground = "CellBackground"
background = "#b57614"

[colors.hints.start]
foreground = "#f9f5d7"
background = "#b57614"

[colors.hints.end]
foreground = "#f9f5d7"
background = "#427b58"

[colors.footer_bar]
foreground = "#3c3836"
background = "#ebdbb2"

[colors.normal]
black = "#3c3836"
