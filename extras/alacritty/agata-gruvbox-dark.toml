# Agata Gruvbox Dark color scheme, generated by tools/gen-app-themes.py from extras/palette.json.
# Matches the Agata-Gruvbox-Dark GTK / GNOME Shell theme (https://github.com/palpinter/agata-gtk-theme).

[colors.primary]
background = "#282828"
foreground = "#ebdbb2"
dim_foreground = "#a89984"
bright_foreground = "#fbf1c7"

[colors.cursor]
text = "#282828"
cursor = "#83a598"

[colors.vi_mode_cursor]
text = "#282828"
cursor = "#8ec07c"

[colors.selection]
text = "CellForeground"
background = "#504945"

[colors.search.matches]
foreground = "CellBackground"
background = "#8ec07c"

[colors.search.focused_match]
foreground = "CellBackground"
background = "#fabd2f"

[colors.hints.start]
foreground = "#282828"
background = "#fabd2f"

[colors.hints.end]
foreground = "#282828"
background = "#8ec07c"

[colors.footer_bar]
foreground = "#ebdbb2"
background = "#3c3836"

[colors.normal]
black = "#3c3836"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "#a89984"

[colors.bright]
black = "#928374"
red = "#fb4934"
green = "#b8bb26"
yellow = "#fabd2f"
blue = "#83a598"
magenta = "#d3869b"
cyan = "#8ec07c"
white = "#ebdbb2"
